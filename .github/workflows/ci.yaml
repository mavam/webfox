name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      live-provider:
        description: Provider ID, or all configured providers (blank skips live tests)
        default: all
        type: string
      live-capability:
        description: Capability to test with the selected live provider
        default: all
        type: choice
        options: [all, search, contents, answer, research]
      live-options-json:
        description: Provider-specific request options as JSON (not credentials)
        default: "{}"
        type: string
      include-research:
        description: Allow a potentially billable research job
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  nix:
    name: Nix package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check Nix formatting
        run: nix fmt -- --check flake.nix nix/package.nix

      - name: Evaluate all supported systems
        run: nix flake check --all-systems --no-build

      - name: Build and smoke-test the installed CLI
        run: nix flake check --print-build-logs

  live-smoke:
    name: Live provider check (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.live-provider != ''
    uses: ./.github/workflows/live-smoke.yaml
    # Required for the called job to resolve its environment-scoped secrets.
    secrets: inherit
    with:
      provider: ${{ inputs.live-provider }}
      capability: ${{ inputs.live-capability }}
      options-json: ${{ inputs.live-options-json }}
      include-research: ${{ inputs.include-research }}

  format:
    name: Code formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  test:
    name: Tests, types & build (Node.js ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check and build
        run: npm run check && npm run build

  package-smoke:
    name: Installed CLI & Pi extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test the packed package
        run: npm run smoke:package
